<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="db-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0096c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="db-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7B61FF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00D9FF;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Database cylinder stack -->
  <!-- Top cylinder -->
  <ellipse cx="100" cy="60" rx="50" ry="15" fill="url(#db-gradient)" stroke="#00D9FF" stroke-width="2"/>
  <rect x="50" y="60" width="100" height="30" fill="url(#db-gradient)"/>
  <ellipse cx="100" cy="90" rx="50" ry="15" fill="url(#db-gradient)" stroke="#00D9FF" stroke-width="2">
    <animate attributeName="fill-opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Middle cylinder -->
  <rect x="50" y="90" width="100" height="30" fill="url(#db-gradient)"/>
  <ellipse cx="100" cy="120" rx="50" ry="15" fill="url(#db-gradient)" stroke="#00D9FF" stroke-width="2">
    <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Bottom cylinder -->
  <rect x="50" y="120" width="100" height="30" fill="url(#db-gradient)"/>
  <ellipse cx="100" cy="150" rx="50" ry="15" fill="url(#db-gradient)" stroke="#00D9FF" stroke-width="2">
    <animate attributeName="fill-opacity" values="1;0.7;1" dur="2s" begin="1s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Data flow lines -->
  <line x1="155" y1="75" x2="175" y2="75" stroke="#7B61FF" stroke-width="2" opacity="0.6">
    <animate attributeName="x1" values="155;165;155" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="175;185;175" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <line x1="155" y1="105" x2="175" y2="105" stroke="#7B61FF" stroke-width="2" opacity="0.6">
    <animate attributeName="x1" values="155;165;155" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="175;185;175" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
  </line>
  <line x1="155" y1="135" x2="175" y2="135" stroke="#7B61FF" stroke-width="2" opacity="0.6">
    <animate attributeName="x1" values="155;165;155" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="175;185;175" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
  </line>
  
  <!-- Incoming data -->
  <circle cx="25" cy="90" r="3" fill="#9ece6a">
    <animate attributeName="cx" values="25;50" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="25" cy="120" r="3" fill="#9ece6a">
    <animate attributeName="cx" values="25;50" dur="1s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="1s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Lock symbol (security) -->
  <rect x="90" y="105" width="20" height="15" rx="2" fill="#ff9e64" opacity="0.8"/>
  <path d="M 95 105 L 95 100 Q 95 95 100 95 Q 105 95 105 100 L 105 105" 
        fill="none" 
        stroke="#ff9e64" 
        stroke-width="2"
        opacity="0.8"/>
</svg>
