<svg width="400" height="280" viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lang-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b26;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24283b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="280" fill="url(#lang-bg)" rx="4.5"/>
  
  <!-- Title -->
  <text x="25" y="35" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,'Fira Sans','Droid Sans','Helvetica Neue',sans-serif" font-size="18" fill="#c0caf5" font-weight="600">
    Most Used Languages
  </text>
  
  <!-- TypeScript -->
  <g transform="translate(25, 65)">
    <rect width="300" height="8" fill="#414868" rx="4"/>
    <rect width="210" height="8" fill="#3178c6" rx="4">
      <animate attributeName="width" from="0" to="210" dur="1s" fill="freeze"/>
    </rect>
    <circle cx="0" cy="4" r="6" fill="#3178c6"/>
    <text x="15" y="9" font-family="Verdana, sans-serif" font-size="12" fill="#c0caf5">TypeScript</text>
    <text x="320" y="9" font-family="Verdana, sans-serif" font-size="12" fill="#9aa5ce" text-anchor="end">45%</text>
  </g>
  
  <!-- JavaScript -->
  <g transform="translate(25, 105)">
    <rect width="300" height="8" fill="#414868" rx="4"/>
    <rect width="165" height="8" fill="#f7df1e" rx="4">
      <animate attributeName="width" from="0" to="165" dur="1s" begin="0.2s" fill="freeze"/>
    </rect>
    <circle cx="0" cy="4" r="6" fill="#f7df1e"/>
    <text x="15" y="9" font-family="Verdana, sans-serif" font-size="12" fill="#c0caf5">JavaScript</text>
    <text x="320" y="9" font-family="Verdana, sans-serif" font-size="12" fill="#9aa5ce" text-anchor="end">35%</text>
  </g>
  
  <!-- Python -->
  <g transform="translate(25, 145)">
    <rect width="300" height="8" fill="#414868" rx="4"/>
    <rect width="90" height="8" fill="#3776ab" rx="4">
      <animate attributeName="width" from="0" to="90" dur="1s" begin="0.4s" fill="freeze"/>
    </rect>
    <circle cx="0" cy="4" r="6" fill="#3776ab"/>
    <text x="15" y="9" font-family="Verdana, sans-serif" font-size="12" fill="#c0caf5">Python</text>
    <text x="320" y="9" font-family="Verdana, sans-serif" font-size="12" fill="#9aa5ce" text-anchor="end">12%</text>
  </g>
  
  <!-- HTML -->
  <g transform="translate(25, 185)">
    <rect width="300" height="8" fill="#414868" rx="4"/>
    <rect width="45" height="8" fill="#e34c26" rx="4">
      <animate attributeName="width" from="0" to="45" dur="1s" begin="0.6s" fill="freeze"/>
    </rect>
    <circle cx="0" cy="4" r="6" fill="#e34c26"/>
    <text x="15" y="9" font-family="Verdana, sans-serif" font-size="12" fill="#c0caf5">HTML</text>
    <text x="320" y="9" font-family="Verdana, sans-serif" font-size="12" fill="#9aa5ce" text-anchor="end">5%</text>
  </g>
  
  <!-- Shell -->
  <g transform="translate(25, 225)">
    <rect width="300" height="8" fill="#414868" rx="4"/>
    <rect width="30" height="8" fill="#89e051" rx="4">
      <animate attributeName="width" from="0" to="30" dur="1s" begin="0.8s" fill="freeze"/>
    </rect>
    <circle cx="0" cy="4" r="6" fill="#89e051"/>
    <text x="15" y="9" font-family="Verdana, sans-serif" font-size="12" fill="#c0caf5">Shell</text>
    <text x="320" y="9" font-family="Verdana, sans-serif" font-size="12" fill="#9aa5ce" text-anchor="end">3%</text>
  </g>
</svg>
