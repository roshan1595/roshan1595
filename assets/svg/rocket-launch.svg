<svg width="200" height="250" viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rocket-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7aa2f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d59a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flame-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9e64;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f7768e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff007c;stop-opacity:0.5" />
    </linearGradient>
  </defs>
  
  <!-- Rocket body -->
  <g>
    <animate attributeName="transform" values="translate(0,0);translate(0,-5);translate(0,0)" dur="1s" repeatCount="indefinite"/>
    
    <!-- Main body -->
    <ellipse cx="100" cy="80" rx="25" ry="30" fill="url(#rocket-body)"/>
    <rect x="75" y="80" width="50" height="60" fill="url(#rocket-body)"/>
    
    <!-- Nose cone -->
    <path d="M 75 50 L 100 20 L 125 50 Z" fill="#9ece6a"/>
    
    <!-- Window -->
    <circle cx="100" cy="70" r="10" fill="#1a1b26" opacity="0.8"/>
    <circle cx="100" cy="70" r="8" fill="#7aa2f7" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Wings -->
    <path d="M 75 120 L 55 160 L 75 150 Z" fill="#f7768e"/>
    <path d="M 125 120 L 145 160 L 125 150 Z" fill="#f7768e"/>
    
    <!-- Details -->
    <rect x="75" y="100" width="50" height="3" fill="#ff9e64" opacity="0.7"/>
    <rect x="75" y="120" width="50" height="3" fill="#ff9e64" opacity="0.7"/>
  </g>
  
  <!-- Flames -->
  <g>
    <animate attributeName="transform" values="translate(0,0) scale(1,1);translate(0,5) scale(1,1.2);translate(0,0) scale(1,1)" dur="0.3s" repeatCount="indefinite"/>
    
    <ellipse cx="100" cy="165" rx="15" ry="25" fill="url(#flame-gradient)" opacity="0.9">
      <animate attributeName="ry" values="25;35;25" dur="0.3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="100" cy="165" rx="10" ry="20" fill="#ffd700" opacity="0.7">
      <animate attributeName="ry" values="20;30;20" dur="0.3s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Smoke particles -->
  <circle cx="90" cy="190" r="5" fill="#9aa5ce" opacity="0.4">
    <animate attributeName="cy" values="190;220" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="195" r="4" fill="#9aa5ce" opacity="0.3">
    <animate attributeName="cy" values="195;225" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="200" r="6" fill="#9aa5ce" opacity="0.5">
    <animate attributeName="cy" values="200;235" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Stars -->
  <circle cx="30" cy="40" r="2" fill="#ffd700">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="60" r="2" fill="#ffd700">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="100" r="1.5" fill="#ffd700">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="120" r="1.5" fill="#ffd700">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
