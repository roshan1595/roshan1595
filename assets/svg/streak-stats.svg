<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="streak-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b26;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24283b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fire-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f7768e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9e64;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="url(#streak-bg)" rx="4.5"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,'Fira Sans','Droid Sans','Helvetica Neue',sans-serif" font-size="18" fill="#c0caf5" font-weight="600" text-anchor="middle">
    🔥 GitHub Streak Stats
  </text>
  
  <!-- Stats Cards -->
  <g transform="translate(50, 70)">
    <!-- Total Contributions -->
    <rect x="0" y="0" width="220" height="100" fill="#414868" rx="8" opacity="0.3"/>
    <text x="110" y="30" font-family="Verdana, sans-serif" font-size="12" fill="#9aa5ce" text-anchor="middle">Total Contributions</text>
    <text x="110" y="65" font-family="Verdana, sans-serif" font-size="32" fill="#7aa2f7" font-weight="bold" text-anchor="middle">677+</text>
    <text x="110" y="85" font-family="Verdana, sans-serif" font-size="11" fill="#9aa5ce" text-anchor="middle">2026</text>
  </g>
  
  <g transform="translate(290, 70)">
    <!-- Current Streak -->
    <rect x="0" y="0" width="220" height="100" fill="#414868" rx="8" opacity="0.3"/>
    <text x="110" y="30" font-family="Verdana, sans-serif" font-size="12" fill="#9aa5ce" text-anchor="middle">Current Streak</text>
    
    <!-- Animated Fire Icon -->
    <g transform="translate(95, 35)">
      <path d="M15 25 Q10 15, 15 10 Q18 15, 15 5 Q20 12, 20 20 Q20 27, 15 25 Z" fill="url(#fire-gradient)">
        <animate attributeName="d" 
                 values="M15 25 Q10 15, 15 10 Q18 15, 15 5 Q20 12, 20 20 Q20 27, 15 25 Z;
                         M15 25 Q10 15, 15 8 Q18 15, 15 3 Q20 12, 20 20 Q20 27, 15 25 Z;
                         M15 25 Q10 15, 15 10 Q18 15, 15 5 Q20 12, 20 20 Q20 27, 15 25 Z"
                 dur="1s" 
                 repeatCount="indefinite"/>
      </path>
    </g>
    
    <text x="110" y="80" font-family="Verdana, sans-serif" font-size="11" fill="#9aa5ce" text-anchor="middle">Active in 2026</text>
  </g>
  
  <g transform="translate(530, 70)">
    <!-- Public Repos -->
    <rect x="0" y="0" width="220" height="100" fill="#414868" rx="8" opacity="0.3"/>
    <text x="110" y="30" font-family="Verdana, sans-serif" font-size="12" fill="#9aa5ce" text-anchor="middle">All Repositories</text>
    <text x="110" y="65" font-family="Verdana, sans-serif" font-size="32" fill="#9ece6a" font-weight="bold" text-anchor="middle">39</text>
    <text x="110" y="85" font-family="Verdana, sans-serif" font-size="11" fill="#9aa5ce" text-anchor="middle">35 private + 4 public</text>
  </g>
</svg>
