<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="health-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B9D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Medical Cross -->
  <g filter="url(#glow)">
    <!-- Vertical bar -->
    <rect x="80" y="40" width="40" height="120" rx="5" fill="url(#health-gradient)">
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Horizontal bar -->
    <rect x="40" y="80" width="120" height="40" rx="5" fill="url(#health-gradient)">
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Pulse line -->
  <polyline points="10,180 40,180 50,160 60,180 70,170 80,180 190,180" 
            fill="none" 
            stroke="#00D9FF" 
            stroke-width="3"
            opacity="0.6">
    <animate attributeName="stroke-dasharray" values="0,300;300,0" dur="3s" repeatCount="indefinite"/>
  </polyline>
  
  <!-- Heart beat dots -->
  <circle cx="100" cy="100" r="3" fill="#00D9FF">
    <animate attributeName="r" values="3;8;3" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
