<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brain-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B61FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9D50BB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B9D;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="node-glow">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00D9FF;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Neural network connections -->
  <g opacity="0.6" stroke="#7B61FF" stroke-width="2" fill="none">
    <line x1="100" y1="50" x2="60" y2="100">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="50" x2="140" y2="100">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="100" x2="60" y2="150">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="140" y1="100" x2="140" y2="150">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="100" x2="100" y2="150">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="140" y1="100" x2="100" y2="150">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Neural nodes -->
  <circle cx="100" cy="50" r="12" fill="url(#brain-gradient)" stroke="#00D9FF" stroke-width="2">
    <animate attributeName="r" values="12;15;12" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="100" r="10" fill="url(#brain-gradient)" stroke="#00D9FF" stroke-width="2">
    <animate attributeName="r" values="10;13;10" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="100" r="10" fill="url(#brain-gradient)" stroke="#00D9FF" stroke-width="2">
    <animate attributeName="r" values="10;13;10" dur="2s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="150" r="12" fill="url(#brain-gradient)" stroke="#00D9FF" stroke-width="2">
    <animate attributeName="r" values="12;15;12" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="150" r="8" fill="url(#brain-gradient)" stroke="#00D9FF" stroke-width="2">
    <animate attributeName="r" values="8;11;8" dur="2s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="150" r="8" fill="url(#brain-gradient)" stroke="#00D9FF" stroke-width="2">
    <animate attributeName="r" values="8;11;8" dur="2s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Glowing effect -->
  <circle cx="100" cy="100" r="60" fill="url(#node-glow)" opacity="0.3">
    <animate attributeName="r" values="60;80;60" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
