<svg width="800" height="120" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b26;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24283b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7B61FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B9D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="120" fill="url(#bg)" rx="10"/>
  
  <!-- Circuit pattern -->
  <g opacity="0.1">
    <circle cx="100" cy="60" r="30" fill="none" stroke="#00D9FF" stroke-width="2"/>
    <circle cx="700" cy="60" r="30" fill="none" stroke="#FF6B9D" stroke-width="2"/>
    <line x1="130" y1="60" x2="670" y2="60" stroke="#7B61FF" stroke-width="2"/>
  </g>
  
  <!-- Main Text -->
  <text x="400" y="55" font-family="'Fira Code', monospace" font-size="28" font-weight="bold" fill="url(#text-gradient)" text-anchor="middle">
    Roshan Kumar Singh
  </text>
  
  <text x="400" y="85" font-family="'Fira Code', monospace" font-size="14" fill="#7aa2f7" text-anchor="middle">
    Full-Stack Engineer • Healthcare Tech Architect • Open Source Enthusiast
  </text>
  
  <!-- Animated dots -->
  <circle cx="50" cy="60" r="4" fill="#00D9FF">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="60" r="4" fill="#FF6B9D">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
