<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bracket-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B61FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Left bracket -->
  <path d="M 80 40 L 50 40 Q 30 40 30 60 L 30 140 Q 30 160 50 160 L 80 160" 
        fill="none" 
        stroke="url(#bracket-gradient)" 
        stroke-width="4"
        stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0,300;300,0" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Right bracket -->
  <path d="M 220 40 L 250 40 Q 270 40 270 60 L 270 140 Q 270 160 250 160 L 220 160" 
        fill="none" 
        stroke="url(#bracket-gradient)" 
        stroke-width="4"
        stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="300,0;0,300" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <!-- Code symbol -->
  <text x="150" y="110" font-family="'Fira Code', monospace" font-size="40" fill="#00D9FF" text-anchor="middle">
    &lt;/&gt;
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </text>
  
  <!-- Floating code particles -->
  <circle cx="100" cy="80" r="3" fill="#7B61FF">
    <animate attributeName="cy" values="80;60;80" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="120" r="3" fill="#00D9FF">
    <animate attributeName="cy" values="120;140;120" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="140" r="2" fill="#FF6B9D">
    <animate attributeName="cx" values="120;140;120" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="60" r="2" fill="#9D50BB">
    <animate attributeName="cx" values="180;160;180" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
